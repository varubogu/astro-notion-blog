# Dependabot version updates
# Schema: https://json.schemastore.org/dependabot-2.0.json
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # bun.lock + package.json (リポジトリルート)
  # package-ecosystem は bun.lock に対して "bun"
  # https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    groups:
      # 同時に上げる必要のある major を先に置く。
      # 一致した依存は最初のグループにだけ入る。
      # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups
      astro-major:
        applies-to: 'version-updates'
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'astro-*'
          - 'eslint-plugin-astro'
        update-types:
          - 'major'
      react-major:
        applies-to: 'version-updates'
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-*'
        update-types:
          - 'major'
      eslint-major:
        applies-to: 'version-updates'
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint-plugin-*'
          - 'globals'
        update-types:
          - 'major'
      metascraper-major:
        applies-to: 'version-updates'
        patterns:
          - 'metascraper'
          - 'metascraper-*'
          - '@types/metascraper'
          - '@types/metascraper-*'
        update-types:
          - 'major'
      mermaid-major:
        applies-to: 'version-updates'
        patterns:
          - 'mermaid'
        update-types:
          - 'major'
      bun-minor-and-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # .github/workflows の actions/* 参照。directory は "/" が正しい
  # (Dependabot が /.github/workflows とルートの action.yml を探索する)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    # Actions は major も含めて 1 グループ。checkout と auto-commit のように
    # 同じワークフローを触る更新を分けない。
    groups:
      github-actions:
        applies-to: 'version-updates'
        patterns:
          - '*'

  # .devcontainer/devcontainer.json の Features。directory は "/" が正しい
  # (Dependabot が .devcontainer/devcontainer.json を探索する)
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    groups:
      devcontainers-minor-and-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
